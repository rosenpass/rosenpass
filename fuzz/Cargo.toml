[package]
name = "rosenpass-fuzzing"
version = "0.0.1"
publish = false
edition = "2021"
rust-version = "1.88.0"

[features]

[package.metadata]
cargo-fuzz = true

[dependencies]
rosenpass = { path = "../rosenpass", features = ["expose_internal_modules"] }
rosenpass-to = { path = "../to" }
arbitrary = { version = "1.4.1", features = ["derive"] }
libfuzzer-sys = "0.4"
stacker = "0.1.21"
ml-kem = { version = "0.3", default-features = false }

[[bin]]
name = "fuzz_handle_msg"
path = "fuzz_targets/handle_msg.rs"
test = false
doc = false

[[bin]]
name = "fuzz_blake2b"
path = "fuzz_targets/blake2b.rs"
test = false
doc = false

[[bin]]
name = "fuzz_aead_enc_into"
path = "fuzz_targets/aead_enc_into.rs"
test = false
doc = false

[[bin]]
name = "fuzz_mceliece_encaps"
path = "fuzz_targets/mceliece_encaps.rs"
test = false
doc = false

[[bin]]
name = "fuzz_kyber_encaps"
path = "fuzz_targets/kyber_encaps.rs"
test = false
doc = false

[[bin]]
name = "fuzz_mlkem_roundtrip"
path = "fuzz_targets/mlkem_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "fuzz_box_secret_alloc"
path = "fuzz_targets/box_secret_alloc.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vec_secret_alloc"
path = "fuzz_targets/vec_secret_alloc.rs"
test = false
doc = false
