[package]
name = "rosenpass"
version = "0.3.0-dev"
authors = ["Karolin Varner <karo@cupdev.net>", "wucke13 <wucke13@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Build post-quantum-secure VPNs with WireGuard!"
homepage = "https://rosenpass.eu/"
repository = "https://github.com/rosenpass/rosenpass"
readme = "readme.md"
rust-version = "1.93.1"

[[bin]]
name = "rosenpass"
path = "src/main.rs"

[[bin]]
name = "rosenpass-gen-ipc-msg-types"
path = "src/bin/gen-ipc-msg-types.rs"
required-features = ["experiment_api", "internal_bin_gen_ipc_msg_types"]

[[test]]
name = "api-integration-tests"
required-features = ["experiment_api", "internal_testing"]

[[test]]
name = "api-integration-tests-api-setup"
required-features = ["experiment_api", "internal_testing"]

[[test]]
name = "gen-ipc-msg-types"
required-features = [
  "experiment_api",
  "internal_testing",
  "internal_bin_gen_ipc_msg_types",
]

[[bench]]
name = "trace_handshake"
harness = false
required-features = ["trace_bench"]

[[bench]]
name = "handshake"
harness = false

[dependencies]
rosenpass-ciphers = { path = "../ciphers" }
rosenpass-cipher-traits = { path = "../cipher-traits" }
rosenpass-to = { path = "../to" }
rosenpass-secret-memory = { path = "../secret-memory" }

anyhow = { version = "1.0", features = ["backtrace", "std"] }
static_assertions = "1.1.0"
memoffset = "0.9.1"
thiserror = "2"
paste = "1.0.15"
log = { version = "0.4.27" }
env_logger = "0.11"
serde = { version = "1.0.217", features = ["derive"] }
toml = "1.1.2"
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.40"
clap_mangen = "0.3.0"
mio = { version = "1.0.3", features = ["net", "os-poll"] }
signal-hook = "0.4.4"
signal-hook-mio = { version = "0.3", features = ["support-v1_0"] }
rand = "0.10"
zerocopy = { version = "0.8", features = ["derive"] }
home = "0.5.12"
derive_builder = "0.20.2"
rosenpass-wireguard-broker = { path = "../wireguard-broker" }
zeroize = "1.9"
hex-literal = { version = "1.1.0", optional = true }
hex = { version = "0.4.3", optional = true }
heck = { version = "0.5.0", optional = true }
command-fds = { version = "0.3.3", optional = true } # Broker dependencies (might need cleanup or changes)
rustix = { version = "1.1.4", features = ["net", "fs", "process"], optional = true } # Broker dependencies (might need cleanup or changes)
uds = { git = "https://github.com/rosenpass/uds", optional = true, features = ["mio_1xx"] }
libcrux-test-utils = { git = "https://github.com/cryspen/libcrux.git", rev = "0ab6d2dd9c1f", optional = true }
assert_tv = { version = "0.6" } #Dev dependencies
base64 = { version = "0.23.0" }
serde_json = { version = "1.0.140" }
num_enum = "0.7.6"
# dependencies of `rosenpass_util`, now `rosenpass::internal::util`:
tokio = { version = "1.46", optional = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
base64ct = { version = "1.6.0", default-features = false }
typenum = { version = "1.17.0" }


[build-dependencies]
anyhow = { version = "1.0", features = ["backtrace", "std"] }

[dev-dependencies]
criterion = "0.8.2"
test_bin = "0.6"
stacker = "0.1.21"
serial_test = "4.0"
tempfile = "3"
rustix = { version = "1.1.4", features = ["net", "fs", "process"] } # Broker dependencies (might need cleanup or changes)
serde_json = { version = "1.0.140" }

[features]
experiment_cookie_dos_mitigation = []
experiment_memfd_secret = ["rosenpass-wireguard-broker/experiment_memfd_secret"]
experiment_api = [
  "dep:hex-literal",
  "dep:uds",
  "dep:command-fds",
  "dep:rustix",
  "experiment_file_descriptor_passing",
  "rosenpass-wireguard-broker/experiment_api",
]
internal_testing = []
internal_bin_gen_ipc_msg_types = ["dep:hex", "dep:heck"]
trace_bench = ["dep:libcrux-test-utils"]
expose_internal_modules = []
# features of `rosenpass_util`:
experiment_file_descriptor_passing = ["dep:uds"]
tokio = ["dep:tokio"]



[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }
