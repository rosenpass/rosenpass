# This config file contains all features of Rosenpass 0.2.3.

public_key = "rp-public-key"
secret_key = "rp-secret-key"
listen = []
verbosity = "Quiet"

[[peers]]
public_key = "rp-peer-public-key"
endpoint = "my-peer.test:9999"
pre_shared_key = "file/to/psk"
exchange_command = [
  "wg",
  "set",
  "wg0",
  "peer",
  "<PEER_ID>",
  "preshared-key",
  "/dev/stdin",
]

# key out option (writes the OSK to a file)
key_out = "rp-key-out"

# WireGuard protocol extension (supplies the OSK to WireGuard)
device = "wg0"
peer = "path/to/their-public-key.pk"
extra_params = []                    # TODO: fill sth. in
